services:

  postgres:
    image: postgres:17
    container_name: redis-demo-postgres
    environment:
      POSTGRES_DB: redis_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: redis-demo-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: